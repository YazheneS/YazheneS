<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crescentBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f5b942"/>
    </linearGradient>
    <linearGradient id="cloud1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="cloud2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <radialGradient id="haze2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="110" cy="110" r="105" fill="url(#haze2)"/>

  <g fill="#ffffff">
    <circle cx="12" cy="20" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="35" r="1.5" opacity="0.7"/>
    <circle cx="15" cy="150" r="1.6" opacity="0.6"/>
    <circle cx="200" cy="170" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <mask id="crescentMask">
    <rect x="0" y="0" width="220" height="220" fill="white"/>
    <circle cx="150" cy="110" r="80" fill="black"/>
  </mask>
  <circle cx="95" cy="110" r="90" fill="url(#crescentBody)" mask="url(#crescentMask)"/>

  <g mask="url(#crescentMask)">
    <circle cx="60" cy="55" r="10" fill="#f5b942" opacity="0.6"/>
    <circle cx="45" cy="140" r="14" fill="#f5b942" opacity="0.6"/>
    <circle cx="70" cy="175" r="8" fill="#f5b942" opacity="0.6"/>
  </g>

  <g transform="translate(15,60)">
    <ellipse cx="30" cy="30" rx="34" ry="24" fill="url(#cloud1)"/>
    <ellipse cx="60" cy="38" rx="26" ry="20" fill="url(#cloud2)"/>
    <ellipse cx="10" cy="42" rx="20" ry="16" fill="url(#cloud1)"/>
  </g>

  <g transform="translate(90,140)">
    <ellipse cx="45" cy="20" rx="40" ry="26" fill="url(#cloud2)"/>
    <ellipse cx="85" cy="28" rx="28" ry="20" fill="url(#cloud1)"/>
    <ellipse cx="20" cy="30" rx="22" ry="18" fill="url(#cloud2)"/>
  </g>
</svg>
